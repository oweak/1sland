name: Deploy 1sland

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ISLAND_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 52.175.55.22 >> ~/.ssh/known_hosts

      - name: Deploy to Azure VM
        run: |
          scp -i ~/.ssh/id_ed25519 index.html azureuser@52.175.55.22:/home/azureuser/index.html
          ssh -i ~/.ssh/id_ed25519 azureuser@52.175.55.22 \
            'sudo cp /home/azureuser/index.html /var/www/html/index.html && sudo nginx -t && sudo systemctl reload nginx'
